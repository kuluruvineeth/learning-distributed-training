name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Run four-process collectives demo
        timeout-minutes: 2
        env:
          OMP_NUM_THREADS: "1"
          GLOO_SOCKET_IFNAME: lo
        run: uv run torchrun --nproc-per-node=4 --master-port=29500 collectives/collectives.py
      - name: Run four-process ring all-reduce demo
        timeout-minutes: 2
        env:
          OMP_NUM_THREADS: "1"
          GLOO_SOCKET_IFNAME: lo
        run: uv run torchrun --nproc-per-node=4 --master-port=29500 ring-all-reduce/ring_all_reduce.py
      - name: Run a short single-device training
        timeout-minutes: 3
        run: uv run python single-device/train.py --steps 25
      - name: Run four-rank data-parallel training
        timeout-minutes: 3
        env:
          OMP_NUM_THREADS: "1"
          GLOO_SOCKET_IFNAME: lo
        run: uv run torchrun --nproc-per-node=4 --master-port=29500 data-parallel/train.py --steps 25
